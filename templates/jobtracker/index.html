{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="{% static 'jobtracker/css/style.css' %}">
</head>
<body>
  <div class="page">
    <div class="wrap">
      <div class="top-row">
        <div>
          <h1 class="title">Job Application Tracker</h1>
          <p class="subtitle" id="subtitle">Loading…</p>
        </div>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Company</th><th>Position</th><th>Status</th>
                <th>Salary</th><th>Round</th><th>Notes</th><th></th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="7" class="empty-cell">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <button class="add-row-btn" id="add-row-btn">+ Add application</button>
      </div>

      <div class="pagination" id="pagination"></div>

      <div class="tabs" id="tabs"></div>
    </div>
  </div>

  <!-- New board modal -->
  <div class="modal-backdrop" id="board-modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="board-modal-title">
      <h2 id="board-modal-title">New board</h2>
      <p class="modal-hint">Give this tab a name, or leave it blank for a default one.</p>
      <label for="board-modal-input">Board name</label>
      <input type="text" id="board-modal-input" placeholder="e.g. Berlin Applications" maxlength="100">
      <p class="modal-error" id="board-modal-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="board-modal-cancel">Cancel</button>
        <button type="button" class="btn-primary" id="board-modal-submit">Create</button>
      </div>
    </div>
  </div>

  <!-- Portal target for the status dropdown menu (the fix — see tracker.js /
       style.css). -->
  <div id="status-dropdown-portal"></div>

  <script>
    window.TRACKER_CONFIG = {
      urls: {
        boards: "/v1/jobtracker/boards/",
        boardItem: "/v1/jobtracker/boards/__id__/",
        applications: "/v1/jobtracker/applications/",
        applicationItem: "/v1/jobtracker/applications/__id__/",
        login: "{% url 'jobtracker:login' %}"
      }
    };
  </script>
  <script src="{% static 'jobtracker/js/auth.js' %}"></script>
  <script src="{% static 'jobtracker/js/tracker.js' %}"></script>
</body>
</html>
