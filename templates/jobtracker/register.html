{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Job Tracker</title>
  <link rel="stylesheet" href="{% static 'jobtracker/css/style.css' %}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">Create an account</h1>
      <p class="auth-subtitle">Start tracking your job applications.</p>

      <p class="auth-error" id="auth-error" hidden></p>

      <form id="register-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="password2">Confirm password</label>
          <input type="password" id="password2" name="password2" autocomplete="new-password" required>
        </div>
        <button type="submit" class="auth-submit" id="submit-btn">Create account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="{% url 'jobtracker:login' %}">Log in</a></p>
    </div>
  </div>

  <script src="{% static 'jobtracker/js/auth.js' %}"></script>
  <script>
    (function () {
      if (window.Auth.AuthStore.isLoggedIn()) {
        window.location.href = "{% url 'jobtracker:index' %}";
        return;
      }

      const form = document.getElementById("register-form");
      const errorEl = document.getElementById("auth-error");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.hidden = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account…";

        try {
          const res = await fetch("/v1/auth/pass/register/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value.trim(),
              email: document.getElementById("email").value.trim(),
              password: document.getElementById("password").value,
              password2: document.getElementById("password2").value,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(window.Auth.formatApiError(data));
          window.Auth.AuthStore.setTokens(data.access, data.refresh);
          window.location.href = "{% url 'jobtracker:index' %}";
        } catch (err) {
          errorEl.textContent = err.message || "Registration failed.";
          errorEl.hidden = false;
          submitBtn.disabled = false;
          submitBtn.textContent = "Create account";
        }
      });
    })();
  </script>
</body>
</html>
